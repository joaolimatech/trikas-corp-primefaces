<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Trikas CRM</title>
    <link rel="icon" type="image/png" href="#{resource['images/office-building.png']}" />
    <style type="text/css">

    </style>
</h:head>

<h:body>
    <h:form id="formMenu" rendered="#{usuarioSessaoMBean.usuarioLogado!=null and usuarioSessaoMBean.usuarioLogado.nome!=null}">
        <p:menubar hideDaley="1000" autoDisplay="false" >
            <f:facet name="start">
                <p:graphicImage name="images/office-building.png"  width="30"
                                height="30" />
            </f:facet>
            <p:submenu label="Funcionários" >
                <p:menuitem value="Consultar funcionário" outcome="consultarFuncionario" />
                <p:menuitem value="Cadastrar funcionário" outcome="cadastrarFuncionario" />
            </p:submenu>
        </p:menubar>
    </h:form>
</h:body>
</html>
